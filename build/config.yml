version: '3'

info:
  companyName: OhneB
  productName: OhneGuessr
  productIdentifier: com.ohneb.ohneguessr
  description: A free, lean, local GeoGuessr alternative.
  copyright: Copyright (c) 2026 OhneB
  version: 0.0.0

fileAssociations:
  - ext: ohne
    name: OhneGuessr Challenge
    description: OhneGuessr challenge file
    iconName: icon

dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir:
      - .cache
      - .git
      - bin
      - frontend
      - node_modules
    file:
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go tool wails3 build DEV=true
      type: blocking
    - cmd: go tool wails3 task common:dev:frontend
      type: background
    - cmd: go tool wails3 task run
      type: primary
