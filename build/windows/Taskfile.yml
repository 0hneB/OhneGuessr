version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps:
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - powershell -NoProfile -Command "Remove-Item -Force 'wails_windows_{{.ARCH}}.syso'"
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      VERSION: '{{.VERSION | default "dev"}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.version={{.VERSION}}"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.version={{.VERSION}}"{{end}}'
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: 0

  generate:syso:
    dir: build
    cmds:
      - go tool wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  package:
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          ARCH: amd64
          VERSION: '{{.VERSION}}'
    cmds:
      - go tool wails3 generate webview2bootstrapper -dir .
      - makensis -DINFO_PRODUCTVERSION={{.VERSION}} -DARG_WAILS_AMD64_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
    vars:
      VERSION: '{{.VERSION | default "0.0.0"}}'

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
