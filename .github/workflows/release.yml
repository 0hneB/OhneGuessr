name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  UPDATE_PUBLIC_KEY: zHw2caFsAlJGZ02o83rf9d9Rf7yRyiWuz/+vrAYIsdU=

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      APPIMAGE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
      DEB_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.deb
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential desktop-file-utils imagemagick libfuse2 libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: npm ci
        working-directory: frontend
      - name: Build Linux app
        run: go tool wails3 build VERSION="$RELEASE_VERSION"
      - name: Stage Linux packages
        run: |
          mkdir -p release package/DEBIAN AppDir
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=OhneGuessr' \
            'Comment=A free, lean, local GeoGuessr alternative.' \
            'Exec=ohneguessr' \
            'Icon=ohneguessr' \
            'Terminal=false' \
            'Categories=Game;' \
            'StartupWMClass=OhneGuessr' > ohneguessr.desktop
          desktop-file-validate ohneguessr.desktop
          convert build/appicon.png -resize 512x512 ohneguessr.png

          install -Dm755 bin/OhneGuessr package/usr/bin/ohneguessr
          install -Dm644 ohneguessr.desktop package/usr/share/applications/ohneguessr.desktop
          install -Dm644 ohneguessr.png package/usr/share/icons/hicolor/512x512/apps/ohneguessr.png
          printf '%s\n' \
            'Package: ohneguessr' \
            "Version: $RELEASE_VERSION" \
            'Section: games' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: OhneB' \
            'Depends: libwebkitgtk-6.0-4, pkexec' \
            'Description: A free, lean, local GeoGuessr alternative.' > package/DEBIAN/control
          dpkg-deb --root-owner-group --build package "release/$DEB_NAME"

          install -Dm755 bin/OhneGuessr AppDir/usr/bin/ohneguessr
          install -Dm644 ohneguessr.desktop AppDir/usr/share/applications/ohneguessr.desktop
          install -Dm644 ohneguessr.png AppDir/usr/share/icons/hicolor/512x512/apps/ohneguessr.png
      - name: Build AppImage
        env:
          LINUXDEPLOY_SHA256: c86d6540f1df31061f02f539a2d3445f8d7f85cc3994eee1e74cd1ac97b76df0
        run: |
          curl --fail --location --output linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum --check
          chmod +x linuxdeploy
          ARCH=x86_64 OUTPUT="$GITHUB_WORKSPACE/release/$APPIMAGE_NAME" ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/ohneguessr \
            --desktop-file AppDir/usr/share/applications/ohneguessr.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/ohneguessr.png \
            --exclude-library 'libgdk_pixbuf-2.0.so*' \
            --exclude-library 'libgio-2.0.so*' \
            --exclude-library 'libglib-2.0.so*' \
            --exclude-library 'libgmodule-2.0.so*' \
            --exclude-library 'libgobject-2.0.so*' \
            --exclude-library 'libgtk-4.so*' \
            --exclude-library 'libjavascriptcoregtk-6.0.so*' \
            --exclude-library 'libsoup-3.0.so*' \
            --exclude-library 'libwebkitgtk-6.0.so*' \
            --output appimage
      - name: Verify Linux packages
        run: |
          test -s "release/$APPIMAGE_NAME"
          test -s "release/$DEB_NAME"
          dpkg-deb --info "release/$DEB_NAME"
          dpkg-deb --contents "release/$DEB_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/*
          if-no-files-found: error
          retention-days: 1

  linux-smoke:
    needs: [prepare, linux]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      APPIMAGE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
      DEB_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.deb
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: release
      - name: Upgrade and inspect DEB
        run: |
          sudo apt-get update
          mkdir old-package
          dpkg-deb --raw-extract "release/$DEB_NAME" old-package
          sed -i 's/^Version:.*/Version: 0~update-smoke/' old-package/DEBIAN/control
          dpkg-deb --root-owner-group --build old-package old.deb
          sudo apt-get install --yes dbus-x11 xvfb ./old.deb
          sudo apt-get --assume-yes --only-upgrade --no-remove install "$GITHUB_WORKSPACE/release/$DEB_NAME"
          test "$(dpkg-query --show --showformat='${Status}' ohneguessr)" = "install ok installed"
          test "$(dpkg-query --show --showformat='${Version}' ohneguessr)" = "$RELEASE_VERSION"
          test -x /usr/bin/ohneguessr
          test -x /usr/bin/pkexec
          test -f /usr/share/applications/ohneguessr.desktop
      - name: Launch AppImage
        run: |
          chmod +x "release/$APPIMAGE_NAME"
          set +e
          timeout 15s dbus-run-session -- xvfb-run -a \
            env APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            "release/$APPIMAGE_NAME" > appimage.log 2>&1
          status=$?
          set -e
          cat appimage.log
          if [ "$status" -ne 124 ]; then
            echo "AppImage exited before the smoke-test timeout (status $status)" >&2
            exit 1
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PORTABLE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64.exe
      SETUP_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Set Windows product version
        shell: pwsh
        run: |
          $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
          $info.fixed.file_version = $env:RELEASE_VERSION
          $info.info.'0000'.ProductVersion = $env:RELEASE_VERSION
          $info | ConvertTo-Json -Depth 10 | Set-Content build/windows/info.json -Encoding utf8
          [xml]$manifest = Get-Content build/windows/wails.exe.manifest -Raw
          $manifest.assembly.assemblyIdentity.SetAttribute('version', "$env:RELEASE_VERSION.0")
          $manifest.Save((Resolve-Path build/windows/wails.exe.manifest).Path)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: npm ci
        working-directory: frontend
      - run: go vet ./internal/app
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build Windows packages
        shell: pwsh
        run: |
          go tool wails3 task windows:package VERSION=$env:RELEASE_VERSION
          go test ./...
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item bin/OhneGuessr.exe "release/$env:PORTABLE_NAME"
          Copy-Item bin/OhneGuessr-amd64-installer.exe "release/$env:SETUP_NAME"
          Get-Item "release/$env:PORTABLE_NAME", "release/$env:SETUP_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: prepare
    runs-on: macos-15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DMG_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-macos.dmg
      UPDATE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-macos-universal.app.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build universal macOS app
        run: |
          go tool wails3 task darwin:package:universal VERSION="$RELEASE_VERSION"
          app=bin/OhneGuessr.app
          binary="$app/Contents/MacOS/OhneGuessr"
          test -x "$binary"
          lipo "$binary" -verify_arch x86_64 arm64
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Build and verify DMG
        run: |
          mkdir -p release dmg
          cp -R bin/OhneGuessr.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname OhneGuessr -srcfolder dmg -format UDZO -ov "release/$DMG_NAME"

          mount_point="$RUNNER_TEMP/ohneguessr-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "release/$DMG_NAME" -mountpoint "$mount_point" -nobrowse -readonly
          trap 'hdiutil detach "$mount_point" || true' EXIT
          test -d "$mount_point/OhneGuessr.app"
          lipo "$mount_point/OhneGuessr.app/Contents/MacOS/OhneGuessr" -verify_arch x86_64 arm64
          hdiutil detach "$mount_point"
          trap - EXIT
      - name: Build and verify updater archive
        run: |
          COPYFILE_DISABLE=1 tar -czf "release/$UPDATE_NAME" -C bin OhneGuessr.app
          update_dir="$RUNNER_TEMP/ohneguessr-update"
          mkdir -p "$update_dir"
          tar -xzf "release/$UPDATE_NAME" -C "$update_dir"
          test -x "$update_dir/OhneGuessr.app/Contents/MacOS/OhneGuessr"
          lipo "$update_dir/OhneGuessr.app/Contents/MacOS/OhneGuessr" -verify_arch x86_64 arm64
          codesign --verify --deep --strict --verbose=2 "$update_dir/OhneGuessr.app"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: release/*
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [prepare, linux-smoke, windows, macos]
    runs-on: ubuntu-22.04
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PORTABLE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64.exe
      SETUP_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
      MAC_UPDATE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-macos-universal.app.tar.gz
      DEB_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.deb
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Sign updater artifacts and write release metadata
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.OHNEGUESSR_UPDATE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY)) {
            throw "OHNEGUESSR_UPDATE_PRIVATE_KEY is not configured"
          }
          $openssl = (Get-Command openssl -ErrorAction Stop).Source
          $privateKey = Join-Path $env:RUNNER_TEMP update-private.pem
          $publicDer = Join-Path $env:RUNNER_TEMP update-public.der
          [IO.File]::WriteAllText($privateKey, $env:UPDATE_PRIVATE_KEY)
          & $openssl pkey -in $privateKey -pubout -outform DER -out $publicDer
          if ($LASTEXITCODE -ne 0) { throw "Invalid updater private key" }
          $publicBytes = [IO.File]::ReadAllBytes($publicDer)
          $publicRaw = $publicBytes[($publicBytes.Length - 32)..($publicBytes.Length - 1)]
          if ([Convert]::ToBase64String($publicRaw) -ne $env:UPDATE_PUBLIC_KEY) {
            throw "Updater private key does not match the embedded public key"
          }

          function Sign-Artifact([string]$path) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $digest = [Convert]::FromHexString($hash)
            $digestPath = Join-Path $env:RUNNER_TEMP "$([IO.Path]::GetFileName($path)).digest"
            $signaturePath = "$digestPath.sig"
            [IO.File]::WriteAllBytes($digestPath, $digest)
            & $openssl pkeyutl -sign -rawin -inkey $privateKey -in $digestPath -out $signaturePath
            if ($LASTEXITCODE -ne 0) { throw "Could not sign $path" }
            $result = [ordered]@{
              hash = $hash
              digest = [Convert]::ToBase64String($digest)
              signature = [Convert]::ToBase64String([IO.File]::ReadAllBytes($signaturePath))
              size = (Get-Item $path).Length
            }
            Remove-Item $digestPath, $signaturePath -Force
            return $result
          }

          $setupName = $env:SETUP_NAME
          $portableName = $env:PORTABLE_NAME
          $macUpdateName = $env:MAC_UPDATE_NAME
          $debName = $env:DEB_NAME
          $setup = Sign-Artifact "release/$setupName"
          $portable = Sign-Artifact "release/$portableName"
          $macUpdate = Sign-Artifact "release/$macUpdateName"
          $deb = Sign-Artifact "release/$debName"
          $base = "https://github.com/0hneB/OhneGuessr/releases/download/$env:RELEASE_TAG"
          $manifest = [ordered]@{
            schemaVersion = 1
            version = $env:RELEASE_VERSION
            notes = "[Check release notes on GitHub](https://github.com/0hneB/OhneGuessr/releases/tag/$env:RELEASE_TAG)"
            # Keep these fields until pre-Wails clients have crossed this release.
            setup = [ordered]@{
              url = "$base/$setupName"
              sha256 = $setup.hash
              signature = $setup.signature
            }
            portable = [ordered]@{
              url = "$base/$portableName"
              sha256 = $portable.hash
              signature = $portable.signature
            }
            artifacts = @(
              [ordered]@{
                url = "$base/$portableName"
                filename = $portableName
                size = $portable.size
                platform = "windows"
                arch = "amd64"
                digestAlgo = "sha256"
                digest = $portable.digest
                signatureAlgo = "ed25519"
                signature = $portable.signature
              }
              [ordered]@{
                url = "$base/$debName"
                filename = $debName
                size = $deb.size
                platform = "linux"
                arch = "amd64"
                digestAlgo = "sha256"
                digest = $deb.digest
                signatureAlgo = "ed25519"
                signature = $deb.signature
              }
              [ordered]@{
                url = "$base/$macUpdateName"
                filename = $macUpdateName
                size = $macUpdate.size
                platform = "darwin"
                digestAlgo = "sha256"
                digest = $macUpdate.digest
                signatureAlgo = "ed25519"
                signature = $macUpdate.signature
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content release/latest.json -Encoding utf8
          Get-ChildItem release -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content release/SHA256SUMS.txt -Encoding ascii
          Remove-Item $privateKey, $publicDer -Force
      - name: Validate release files
        run: |
          expected=(
            "OhneGuessr-$RELEASE_VERSION-linux-x64.AppImage"
            "OhneGuessr-$RELEASE_VERSION-linux-x64.deb"
            "OhneGuessr-$RELEASE_VERSION-macos.dmg"
            "OhneGuessr-$RELEASE_VERSION-macos-universal.app.tar.gz"
            "OhneGuessr-$RELEASE_VERSION-windows-x64-setup.exe"
            "OhneGuessr-$RELEASE_VERSION-windows-x64.exe"
            "SHA256SUMS.txt"
            "latest.json"
          )
          mapfile -t actual < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}"); then
            echo "Release files do not match the expected set" >&2
            exit 1
          fi
          jq -e --arg filename "OhneGuessr-$RELEASE_VERSION-linux-x64.deb" '
            .artifacts | any(
              .platform == "linux" and
              .arch == "amd64" and
              .filename == $filename and
              .digestAlgo == "sha256" and
              .signatureAlgo == "ed25519" and
              (.digest | length) > 0 and
              (.signature | length) > 0
            )
          ' release/latest.json > /dev/null
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release upload "$RELEASE_TAG" \
            "release/OhneGuessr-$RELEASE_VERSION-linux-x64.AppImage" \
            "release/OhneGuessr-$RELEASE_VERSION-linux-x64.deb" \
            "release/OhneGuessr-$RELEASE_VERSION-macos.dmg" \
            "release/OhneGuessr-$RELEASE_VERSION-macos-universal.app.tar.gz" \
            "release/OhneGuessr-$RELEASE_VERSION-windows-x64-setup.exe" \
            "release/OhneGuessr-$RELEASE_VERSION-windows-x64.exe" \
            release/SHA256SUMS.txt \
            release/latest.json
      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = "8"
