name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  UPDATE_PUBLIC_KEY: zHw2caFsAlJGZ02o83rf9d9Rf7yRyiWuz/+vrAYIsdU=

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      APPIMAGE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
      DEB_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.deb
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential desktop-file-utils imagemagick libfuse2 libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: npm ci
        working-directory: frontend
      - name: Build Linux app
        run: go tool wails3 build VERSION="$RELEASE_VERSION"
      - name: Build and verify Linux packages
        env:
          LINUXDEPLOY_SHA256: c86d6540f1df31061f02f539a2d3445f8d7f85cc3994eee1e74cd1ac97b76df0
        run: bash build/linux/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/*
          if-no-files-found: error
          retention-days: 1

  linux-smoke:
    needs: [prepare, linux]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      APPIMAGE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
      DEB_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.deb
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: release
      - name: Check DEB upgrade and launch AppImage
        run: bash build/linux/smoke-release.sh

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PORTABLE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64.exe
      SETUP_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Set Windows product version
        shell: pwsh
        run: |
          $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
          $info.fixed.file_version = $env:RELEASE_VERSION
          $info.info.'0000'.ProductVersion = $env:RELEASE_VERSION
          $info | ConvertTo-Json -Depth 10 | Set-Content build/windows/info.json -Encoding utf8
          [xml]$manifest = Get-Content build/windows/wails.exe.manifest -Raw
          $manifest.assembly.assemblyIdentity.SetAttribute('version', "$env:RELEASE_VERSION.0")
          $manifest.Save((Resolve-Path build/windows/wails.exe.manifest).Path)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: npm ci
        working-directory: frontend
      - run: go vet ./internal/...
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build Windows packages
        shell: pwsh
        run: |
          go tool wails3 task windows:package VERSION=$env:RELEASE_VERSION
          go test ./...
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item bin/OhneGuessr.exe "release/$env:PORTABLE_NAME"
          Copy-Item bin/OhneGuessr-amd64-installer.exe "release/$env:SETUP_NAME"
          Get-Item "release/$env:PORTABLE_NAME", "release/$env:SETUP_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: prepare
    runs-on: macos-15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DMG_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-macos.dmg
      UPDATE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-macos-universal.app.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build universal macOS app
        run: |
          go tool wails3 task darwin:package:universal VERSION="$RELEASE_VERSION"
          app=bin/OhneGuessr.app
          binary="$app/Contents/MacOS/OhneGuessr"
          test -x "$binary"
          lipo "$binary" -verify_arch x86_64 arm64
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Build and verify macOS packages
        run: bash build/darwin/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: release/*
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [prepare, linux-smoke, windows, macos]
    runs-on: ubuntu-22.04
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PORTABLE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64.exe
      SETUP_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
      MAC_UPDATE_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-macos-universal.app.tar.gz
      DEB_NAME: OhneGuessr-${{ needs.prepare.outputs.version }}-linux-x64.deb
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Sign updater artifacts and write release metadata
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.OHNEGUESSR_UPDATE_PRIVATE_KEY }}
        run: ./build/release/sign.ps1
      - name: Validate release files
        run: bash build/release/validate.sh
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release upload "$RELEASE_TAG" \
            "release/OhneGuessr-$RELEASE_VERSION-linux-x64.AppImage" \
            "release/OhneGuessr-$RELEASE_VERSION-linux-x64.deb" \
            "release/OhneGuessr-$RELEASE_VERSION-macos.dmg" \
            "release/OhneGuessr-$RELEASE_VERSION-macos-universal.app.tar.gz" \
            "release/OhneGuessr-$RELEASE_VERSION-windows-x64-setup.exe" \
            "release/OhneGuessr-$RELEASE_VERSION-windows-x64.exe" \
            release/SHA256SUMS.txt \
            release/latest.json
      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = "8"
