name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Check generated bindings
        run: |
          go tool wails3 generate bindings -ts -i -noevents ./...
          git diff --exit-code -- frontend/bindings
          test -z "$(git ls-files --others --exclude-standard frontend/bindings)"
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race ./...

  windows-package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: npm ci
        working-directory: frontend
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build portable app and installer
        shell: pwsh
        run: |
          go tool wails3 task windows:package VERSION=0.0.0
          Get-Item bin/OhneGuessr.exe, bin/OhneGuessr-amd64-installer.exe
      - run: go test ./...
      - uses: actions/upload-artifact@v7
        with:
          name: OhneGuessr-windows-x64
          path: |
            bin/OhneGuessr.exe
            bin/OhneGuessr-amd64-installer.exe
          if-no-files-found: error
          retention-days: 7
